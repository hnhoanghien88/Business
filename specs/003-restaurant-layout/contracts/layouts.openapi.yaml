openapi: 3.1.0
info: { title: Restaurant Layouts API, version: 1.0.0 }
paths:
  /api/restaurant/layouts/areas:
    get:
      summary: List areas
      security: [{ bearerAuth: [] }]
      x-permission: Layouts.Read
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 150 } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [displayOrder, name, code] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { description: Paged areas }, '401': { description: Unauthorized }, '403': { description: Forbidden } }
    post:
      summary: Create area
      security: [{ bearerAuth: [] }]
      x-permission: Layouts.Create
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateArea' } } } }
      responses: { '201': { description: Created }, '400': { description: Invalid }, '409': { description: Duplicate } }
  /api/restaurant/layouts/areas/{code}:
    get:
      summary: Get area impact
      security: [{ bearerAuth: [] }]
      x-permission: Layouts.Read
      responses: { '200': { description: Area }, '404': { description: Not found } }
    put:
      summary: Update or activate/deactivate area
      security: [{ bearerAuth: [] }]
      x-permission: Layouts.Update
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateArea' } } } }
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '409': { description: Conflict } }
  /api/restaurant/layouts/tables:
    get:
      summary: List tables
      security: [{ bearerAuth: [] }]
      x-permission: Layouts.Read
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 150 } }
        - { name: areaId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [area, name, code, capacity, status] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { description: Paged tables } }
    post:
      summary: Create table
      security: [{ bearerAuth: [] }]
      x-permission: Layouts.Create
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTable' } } } }
      responses: { '201': { description: Created }, '400': { description: Invalid }, '409': { description: Conflict } }
  /api/restaurant/layouts/tables/{code}:
    get:
      summary: Get table safety details
      security: [{ bearerAuth: [] }]
      x-permission: Layouts.Read
      responses: { '200': { description: Table }, '404': { description: Not found } }
    put:
      summary: Update mutable configuration without operational status
      security: [{ bearerAuth: [] }]
      x-permission: Layouts.Update
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTable' } } } }
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '409': { description: Conflict } }
  /api/restaurant/layouts/tables/{code}/activation:
    put:
      summary: Disable or reactivate eligible table
      security: [{ bearerAuth: [] }]
      x-permission: Layouts.Update
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableActivation' } } } }
      responses: { '200': { description: Updated }, '409': { description: Unsafe or stale } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    CreateArea:
      type: object
      required: [code, name, displayOrder]
      properties: { code: { type: string, maxLength: 50 }, name: { type: string, maxLength: 150 }, description: { type: [string, 'null'], maxLength: 500 }, displayOrder: { type: integer } }
    UpdateArea:
      type: object
      required: [name, displayOrder, isActive, version]
      properties: { name: { type: string, maxLength: 150 }, description: { type: [string, 'null'], maxLength: 500 }, displayOrder: { type: integer }, isActive: { type: boolean }, confirmImpact: { type: boolean, default: false }, version: { type: string, format: date-time } }
    CreateTable:
      type: object
      required: [areaId, code, name, capacity]
      properties: { areaId: { type: integer, format: int64 }, code: { type: string, maxLength: 50 }, name: { type: string, maxLength: 150 }, capacity: { type: integer, minimum: 1, maximum: 1000 } }
    UpdateTable:
      type: object
      required: [areaId, name, capacity, version]
      properties: { areaId: { type: integer, format: int64 }, name: { type: string, maxLength: 150 }, capacity: { type: integer, minimum: 1, maximum: 1000 }, version: { type: string, format: date-time } }
    TableActivation:
      type: object
      required: [isActive, version]
      properties: { isActive: { type: boolean }, version: { type: string, format: date-time } }
